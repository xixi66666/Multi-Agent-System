spring:
  datasource:
    url: jdbc:mysql://YOUR_DB_HOST:3306/vibe_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

vibe:
  persistence:
    mode: mysql
  workspace:
    allowed-roots:
      - D:/Code
    worktree-root: .worktrees
